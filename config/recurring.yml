# Solid Queue recurring schedule (parsed by Fugit).
# https://github.com/rails/solid_queue#recurring-tasks

development:
  generate_monthly_draft_billings:
    class: GenerateMonthlyDraftBillingsJob
    queue: default
    # 00:05 UTC on the 1st of every month — creates drafts for the closed month
    schedule: "5 0 1 * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  generate_monthly_draft_billings:
    class: GenerateMonthlyDraftBillingsJob
    queue: default
    schedule: "5 0 1 * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
